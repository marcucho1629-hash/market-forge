name: V3 Shadow Unit Checks
on:
  pull_request:
    paths:
      - "scanner/v3_shadow/**"
      - "tests/test_v3_shadow.py"
      - ".github/workflows/v3-shadow-unit.yml"
permissions:
  contents: read
jobs:
  v3-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run isolated synthetic unit tests
        run: python3 -m unittest discover -s tests -p test_v3_shadow.py -v
