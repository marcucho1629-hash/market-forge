name: Market Forge V2.1 Regression
on:
  pull_request:
    paths:
      - scanner/v21_direction.py
      - scanner/v22_weakness_shadow.py
      - scanner/early_options_0530.py
      - scanner/early_schedule_shadow.py
      - scanner/intraday_v3.py
      - scanner/intraday_early_watch.py
      - tests/test_v21_direction.py
      - tests/test_v22_weakness_shadow.py
      - tests/test_early_options_0530.py
      - tests/test_early_schedule_shadow.py
      - index.py
      - vercel.json
      - .github/workflows/v21-regression.yml
  push:
    branches:
      - feature/v21-confirm-flip-five-minute-20261123
      - main
    paths:
      - scanner/v21_direction.py
      - scanner/v22_weakness_shadow.py
      - scanner/early_options_0530.py
      - scanner/early_schedule_shadow.py
      - scanner/intraday_v3.py
      - scanner/intraday_early_watch.py
      - tests/test_v21_direction.py
      - tests/test_v22_weakness_shadow.py
      - tests/test_early_options_0530.py
      - tests/test_early_schedule_shadow.py
      - index.py
      - vercel.json
      - .github/workflows/v21-regression.yml
permissions:
  contents: read
jobs:
  direction-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scanner/v21_direction.py scanner/v22_weakness_shadow.py scanner/early_options_0530.py scanner/early_schedule_shadow.py scanner/intraday_v3.py scanner/intraday_early_watch.py index.py
      - run: python -m unittest discover -s tests -p 'test_v21_direction.py' -v
      - run: python -m unittest discover -s tests -p 'test_v22_weakness_shadow.py' -v
      - run: python -m unittest discover -s tests -p 'test_early_options_0530.py' -v
      - run: python -m unittest discover -s tests -p 'test_early_schedule_shadow.py' -v
      - run: python -m unittest discover -s tests -p 'test_intraday_v3.py' -v
      - run: python -m unittest discover -s tests -p 'test_intraday_early_watch.py' -v
