name: DAY Data Gap Telegram Silence Regression
on:
  pull_request:
    paths:
      - "scanner/v136_live/runtime.py"
      - "tests/test_v136_data_gap_silence.py"
      - "tests/test_v136_live_runtime.py"
      - ".github/workflows/day-gap-notification.yml"
permissions:
  contents: read
jobs:
  gap-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Gap diagnostics and existing live-engine regressions
        run: |
          python3 -m unittest discover -s tests -p test_v136_data_gap_silence.py -v
          python3 -m unittest discover -s tests -p test_v136_live_runtime.py -v
