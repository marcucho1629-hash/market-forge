name: DAY Gap Notification Regression
on:
  pull_request:
    paths:
      - "scanner/v136_live/runtime.py"
      - "tests/test_v136_data_gap_silence.py"
      - "tests/test_v136_live_runtime.py"
      - ".github/workflows/day-gap-silence.yml"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install dependencies
        run: python3 -m pip install -r requirements.txt
      - name: Run DAY signal and gap tests
        run: |
          python3 -m unittest discover -s tests -p test_v136_data_gap_silence.py -v
          python3 -m unittest discover -s tests -p test_v136_live_runtime.py -v
