name: Intraday V3 WATCH Regression
on:
  pull_request:
    paths:
      - "scanner/intraday_v3.py"
      - "scanner/day_v32_shadow.py"
      - "tests/test_day_v32_shadow.py"
      - "scanner/intraday_early_watch.py"
      - "scanner/opening_radar_0735.py"
      - "tests/test_opening_radar_0735.py"
      - "tests/test_intraday_early_watch.py"
      - "scanner/day_v31_shadow.py"
      - "scanner/v136_live/engine.py"
      - "tests/test_day_v31_shadow.py"
      - "scanner/overnight_watch.py"
      - "tests/test_overnight_watch.py"
      - "scanner/top20_entry_gate.py"
      - "scanner/store.py"
      - "tests/test_top20_entry_gate.py"
      - "scanner/preopen/**"
      - "tests/test_intraday_v3.py"
      - "tests/test_preopen*.py"
      - "index.py"
      - "vercel.json"
      - ".github/workflows/intraday-v3.yml"
permissions:
  contents: read
jobs:
  intraday-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Preopen and intraday unit regression
        run: |
          python3 -m unittest discover -s tests -p 'test_preopen*.py' -v
          python3 -m unittest discover -s tests -p test_intraday_v3.py -v
          python3 -m unittest discover -s tests -p test_intraday_early_watch.py -v
          python3 -m unittest discover -s tests -p test_opening_radar_0735.py -v
          python3 -m unittest discover -s tests -p test_top20_entry_gate.py -v
          python3 -m unittest discover -s tests -p test_overnight_watch.py -v
          python3 -m unittest discover -s tests -p test_day_v31_shadow.py -v
          python3 -m unittest discover -s tests -p test_day_v32_shadow.py -v
