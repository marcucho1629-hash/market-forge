name: Preopen V2 Context Regression
on:
  pull_request:
    paths:
      - "scanner/preopen/**"
      - "tests/test_preopen*.py"
      - ".github/workflows/preopen-v2-context.yml"
permissions:
  contents: read
jobs:
  preopen-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install runtime and test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: V1 existing and V2 prior-session regression tests
        run: python3 -m unittest discover -s tests -p 'test_preopen*.py' -v
