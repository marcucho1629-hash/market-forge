name: Swing Delivery Integrity Checks
on:
  pull_request:
    paths:
      - "scanner/swing_compare.py"
      - "tests/test_swing_clock.py"
      - ".github/workflows/swing-delivery-integrity.yml"
permissions:
  contents: read
jobs:
  swing-delivery-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt
      - name: Swing ingest and diagnostics regression tests
        run: python3 -m unittest discover -s tests -p test_swing_clock.py -v
