name: Shadow Egress Guard Checks
on:
  pull_request:
    paths:
      - "scanner/v136_live/web.py"
      - "tests/test_v136_auto_shadow_optin.py"
      - ".github/workflows/shadow-egress-check.yml"
permissions:
  contents: read
jobs:
  optin-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Python runtime requirements
        run: python3 -m pip install -r requirements.txt
      - name: Run isolated opt-in checks
        run: python3 -m unittest discover -s tests -p test_v136_auto_shadow_optin.py -v
